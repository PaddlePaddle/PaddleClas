# Global configurations
Global:
  checkpoints: null
  pretrained_model: null
  output_dir: "./output/"
  device: "gpu"
  save_interval: 1
  eval_during_train: True
  eval_interval: 1
  epochs: 10
  print_batch_step: 10
  use_visualdl: False
  # used for static mode and mps
  image_shape: [3, 256, 256]
  save_inference_dir: "./inference"

# model architecture
Arch:
  name: "MobileCLIP2_S0"
  class_num: 1000 # Just for placeholder if needed for classification task

# loss function config for training/eval
Loss:
  Train:
    - CELoss:
        weight: 1.0
  Eval:
    - CELoss:
        weight: 1.0

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-8
  weight_decay: 0.05
  one_dim_param_no_grad: true
  lr:
    name: Cosine
    learning_rate: 1e-3
    eta_min: 1e-5
    warmup_epoch: 2

# data loader for train and eval
DataLoader:
  Train:
    dataset:
      name: ImageNetDataset
      image_root: "./dataset/ILSVRC2012/"
      cls_label_path: "./dataset/ILSVRC2012/train_list.txt"
      transform_ops:
        - DecodeImage:
            to_rgb: True
            channel_first: False
        - RandCropImage:
            size: 256
        - RandFlipImage:
            flip_code: 1
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ''
        - ToCHWImage:

  Eval:
    dataset:
      name: ImageNetDataset
      image_root: "./dataset/ILSVRC2012/"
      cls_label_path: "./dataset/ILSVRC2012/val_list.txt"
      transform_ops:
        - DecodeImage:
            to_rgb: True
            channel_first: False
        - ResizeImage:
            resize_short: 256
        - CropImage:
            size: 256
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ''
        - ToCHWImage:
    sampler:
      name: DistributedBatchSampler
      batch_size: 64
      drop_last: False
      shuffle: False
    loader:
      num_workers: 4
      use_shared_memory: True

Metric:
  Eval:
    - TopkAcc:
        topk: [1, 5]
